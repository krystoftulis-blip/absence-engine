# Entity registry - the unification boundary, made executable.
#
# The brief asks for a decision about what to unify. This file IS that decision:
# every legal entity is classified into exactly one treatment, and the engine
# refuses to silently ignore an entity that is not listed here.
#
# The reasoning: Groupon files ~40 subsidiaries in Exhibit 21.1 but operates
# consumer sites in 13 countries and employs 1,734 people in total. Entity count
# and employee count are not the same problem. Configuring 40 policy sets would
# be forty legal reviews a year to serve a population that is concentrated in a
# handful of entities. Configuring the entities where the people actually are,
# and putting a named human owner on the rest, is cheaper and safer.
#
# HONESTY NOTE: the per-entity headcount split is NOT public. The `headcount`
# figures below are working assumptions used to demonstrate the segmentation
# method. Replacing them with the real HRIS extract is verification step #1 in
# DECISION.md, and it may well move entities between treatments.

version: 1
as_of: 2026-09-01

headcount_basis:
  source: "Groupon, Inc. Form 10-K for FY2025 (filed March 2026), Human Capital"
  total_employees: 1734
  north_america: 421
  international: 1313
  public_anchors:
    - "13 countries with localised consumer sites"
    - "significant shared service operations in Poland (stated in the 10-K)"
    - "Groupon Shared Services Private Limited exists in India (Exhibit 21.1)"
  entity_level_split: assumed

treatments:
  engine: >
    Full policy configuration in this repository. Balances are computed by the
    shared engine, reconciled against the local record, and audited. Reserved
    for entities with enough employees that manual administration is a real
    cost and a real compliance exposure.
  register_only: >
    Employees exist but the population is too small to justify a maintained
    rule set in v1. The entity stays on its local process, but it is listed in
    a controlled register with a named accountable owner, an annual attestation
    and a mandatory review date. This is a deliberate scope decision, not an
    oversight - the risk of a stale, unreviewed policy file is higher than the
    risk of a small entity continuing as today under explicit ownership.
  dormant: >
    No employees on payroll (holding, IP, legacy trading or wound-down
    entities). Out of scope. Re-checked annually against Exhibit 21.1 so an
    entity that starts hiring cannot silently fall outside the system.

entities:
