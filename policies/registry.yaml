  - entity_id: PL-SSC
    legal_entity: "Groupon Shared Services Poland Sp. z.o.o."
    jurisdiction: PL
    treatment: engine
    headcount: 520
    rationale: "Largest single population; the 10-K names Poland as a shared services hub."

  - entity_id: IN-SSC
    legal_entity: "Groupon Shared Services Private Limited"
    jurisdiction: IN
    treatment: engine
    headcount: 380
    rationale: "Second shared services hub; rules differ by state, so manual tracking is the least reliable here."

  - entity_id: US-CORP
    legal_entity: "Groupon, Inc."
    jurisdiction: US
    treatment: engine
    headcount: 400
    rationale: "North America segment population; no statutory floor, so the policy itself is the only control."

  - entity_id: IE-INTL
    legal_entity: "Groupon International Ltd."
    jurisdiction: IE
